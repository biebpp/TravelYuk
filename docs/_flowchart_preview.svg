<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Flowchart Alur Pengguna dan Booking - Travel Yuk</title>
  <desc id="desc">Alur pengguna mencari paket, masuk, mengisi formulir booking, validasi, penyimpanan, dan hasil booking.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L11 6 L1 11 Z" fill="#287c78"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #17324d; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #52677d; }
      .node { fill: #e7f1fb; stroke: #4779a8; stroke-width: 2; }
      .action { fill: #e3f4f1; stroke: #287c78; stroke-width: 2; }
      .decision { fill: #fff3d6; stroke: #c28a24; stroke-width: 2; }
      .terminator { fill: #eaf5e9; stroke: #4b8a54; stroke-width: 2; }
      .node-text { font-size: 17px; font-weight: 600; }
      .decision-text { font-size: 16px; font-weight: 700; }
      .small { font-size: 14px; fill: #52677d; }
      .flow { fill: none; stroke: #287c78; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .label { font-size: 15px; font-weight: 600; paint-order: stroke; stroke: #f5f8fc; stroke-width: 7px; stroke-linejoin: round; }
      .note { font-size: 13px; fill: #64788b; }
    </style>
  </defs>
  <rect width="1200" height="500" fill="#f5f8fc"/>
  <text x="35" y="40" class="title">Flowchart Alur Pengguna dan Booking</text>
  <text x="35" y="68" class="subtitle">Website Sistem Manajemen Travel Wisata — Travel Yuk</text>

  <rect x="35" y="120" width="95" height="54" rx="27" class="terminator"/>
  <text x="82" y="153" text-anchor="middle" class="node-text">Mulai</text>

  <rect x="165" y="110" width="165" height="75" rx="10" class="node"/>
  <text x="247" y="140" text-anchor="middle" class="node-text">Buka website</text>
  <text x="247" y="164" text-anchor="middle" class="small">Cari / filter paket</text>

  <rect x="360" y="110" width="165" height="75" rx="10" class="node"/>
  <text x="442" y="140" text-anchor="middle" class="node-text">Pilih paket</text>
  <text x="442" y="164" text-anchor="middle" class="small">Lihat detail</text>

  <polygon points="575,88 635,145 575,202 515,145" class="decision"/>
  <text x="575" y="139" text-anchor="middle" class="decision-text">Sudah</text>
  <text x="575" y="160" text-anchor="middle" class="decision-text">masuk?</text>

  <rect x="665" y="110" width="155" height="75" rx="10" class="node"/>
  <text x="742" y="140" text-anchor="middle" class="node-text">Isi formulir</text>
  <text x="742" y="164" text-anchor="middle" class="small">Nama, kontak, jadwal,</text>
  <text x="742" y="181" text-anchor="middle" class="small">jumlah peserta</text>

  <rect x="860" y="110" width="155" height="75" rx="10" class="action"/>
  <text x="937" y="140" text-anchor="middle" class="node-text">Kirim booking</text>
  <text x="937" y="164" text-anchor="middle" class="small">Sistem memvalidasi data</text>

  <polygon points="1080,88 1150,145 1080,202 1010,145" class="decision"/>
  <text x="1080" y="131" text-anchor="middle" class="decision-text">Paket aktif,</text>
  <text x="1080" y="151" text-anchor="middle" class="decision-text">data valid,</text>
  <text x="1080" y="171" text-anchor="middle" class="decision-text">kuota cukup?</text>

  <rect x="485" y="225" width="180" height="58" rx="10" class="action"/>
  <text x="575" y="249" text-anchor="middle" class="node-text">Masuk / daftar</text>
  <text x="575" y="270" text-anchor="middle" class="small">Lalu lanjut booking</text>

  <rect x="960" y="245" width="230" height="66" rx="10" class="action"/>
  <text x="1075" y="273" text-anchor="middle" class="node-text">Simpan booking</text>
  <text x="1075" y="296" text-anchor="middle" class="small">Cadangkan kuota paket / tiket</text>

  <rect x="650" y="320" width="250" height="68" rx="10" class="node"/>
  <text x="775" y="347" text-anchor="middle" class="node-text">Tampilkan kode booking</text>
  <text x="775" y="373" text-anchor="middle" class="small">Status menunggu • belum dibayar</text>

  <rect x="505" y="330" width="120" height="50" rx="25" class="terminator"/>
  <text x="565" y="360" text-anchor="middle" class="node-text">Selesai</text>

  <rect x="900" y="420" width="200" height="52" rx="10" fill="#fdebec" stroke="#b94c55" stroke-width="2"/>
  <text x="1000" y="443" text-anchor="middle" class="node-text">Tampilkan pesan error</text>
  <text x="1000" y="463" text-anchor="middle" class="small">Perbaiki formulir / pilih paket lain</text>

  <path class="flow" d="M130 147 H165"/>
  <path class="flow" d="M330 147 H360"/>
  <path class="flow" d="M525 147 H515"/>
  <path class="flow" d="M635 145 H665"/>
  <text x="642" y="132" class="label">Ya</text>
  <path class="flow" d="M820 147 H860"/>
  <path class="flow" d="M1015 147 H1010"/>

  <path class="flow" d="M575 202 V225"/>
  <text x="588" y="218" class="label">Tidak</text>
  <path class="flow" d="M665 254 H685 V185 H742"/>
  <text x="686" y="238" class="label">Login berhasil</text>

  <path class="flow" d="M1080 202 V245"/>
  <text x="1092" y="228" class="label">Ya</text>
  <path class="flow" d="M1075 311 V354 H900"/>
  <path class="flow" d="M650 354 H625"/>

  <path class="flow" d="M1150 145 V390 H1100 V420"/>
  <text x="1158" y="235" class="label">Tidak</text>
  <path class="flow" d="M900 446 H820 V185 H742"/>
  <text x="825" y="432" class="label">Perbaiki data</text>

  <text x="35" y="485" class="note">Pembayaran dikonfirmasi admin secara manual; website tidak terhubung ke payment gateway. Sumber: alur aplikasi Travel Yuk.</text>
</svg>
